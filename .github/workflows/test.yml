name: PortfolioIQ quality gates

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  python:
    name: Analytics, security and SQLite migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: production/requirements.txt
      - run: pip install -r production/requirements.txt
      - run: python scripts/prepublish_check.py
      - run: python -m pip install 'PyYAML>=6,<7'
      - run: python scripts/check_render_blueprint.py
      - run: python -m pytest -q backend/tests
      - run: python -m pytest -q production/server/tests/test_v4.py production/server/tests/test_hardening.py production/server/tests/test_phase5.py production/server/tests/test_v07.py production/server/tests/test_v08.py production/server/tests/test_official_feeds.py
      - run: python -m server.evaluation.evaluate
        working-directory: production
      - name: Verify frozen SQLite schema migrations
        run: |
          export DATABASE_URL="sqlite:////tmp/portfolioiq_migration_ci.sqlite3"
          python -m alembic upgrade head
          python -m alembic current
        working-directory: production

  postgres:
    name: PostgreSQL 17 integration and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portfolioiq
          POSTGRES_DB: portfolioiq_ci
          POSTGRES_PASSWORD: portfolioiq_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolioiq -d portfolioiq_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://portfolioiq:portfolioiq_ci_test_only@127.0.0.1:5432/portfolioiq_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r production/requirements.txt
      - name: Apply Alembic migrations to real PostgreSQL
        env:
          DATABASE_URL: ${{ env.TEST_POSTGRES_URL }}
        run: python -m alembic upgrade head
        working-directory: production
      - name: Exercise authenticated API against real PostgreSQL
        run: python -m pytest -q production/server/tests/test_postgres_live.py

  web:
    name: React and TypeScript production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: production/web
      - run: npm run build
        working-directory: production/web

  e2e:
    name: React browser smoke tests
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r production/requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm install --no-audit --no-fund
        working-directory: production/web
      - run: npm run build
        working-directory: production/web
      - name: Launch app and exercise user flows in Chromium
        env:
          DATABASE_URL: sqlite:////tmp/portfolioiq_e2e_ci.sqlite3
          PORTFOLIOIQ_E2E_URL: http://127.0.0.1:8000
        run: |
          python -m uvicorn production.server.app:app --host 127.0.0.1 --port 8000 > /tmp/portfolioiq_server.log 2>&1 &
          server_pid=$!
          trap 'cat /tmp/portfolioiq_server.log; kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/api/v4/health', timeout=1)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError('PortfolioIQ API did not start')
          PY
          python -m pytest -q production/e2e/test_browser.py


  image:
    name: Beta container packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build beta Docker image (React + FastAPI)
        run: docker build -f production/Dockerfile -t portfolioiq:ci .
      - name: Validate deployment config file syntax
        run: |
          cp production/.env.beta.example production/.env.beta
          docker compose --env-file production/.env.beta -f production/compose.beta.yaml config --quiet