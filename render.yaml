# OPTIONAL: ephemeral, invite-only demonstration deployment on Render.
# Do not create this blueprint without reviewing docs/RENDER_BETA_DEPLOY.md.
# The free PostgreSQL plan expires after 30 days and has NO backups.
# Never import real investment data or use real brokerage credentials.
services:
  - type: web
    name: portfolioiq-private-beta
    runtime: docker
    plan: free
    region: ohio
    branch: main
    dockerfilePath: production/Dockerfile
    dockerContext: .
    dockerCommand: sh /app/production/start_beta.sh
    healthCheckPath: /api/v4/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: DEPLOYMENT_MODE
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: BETA_DEMO_ONLY
        value: "true"
      - key: PORT
        value: "8000"
      - key: AUTH_RATE_LIMIT_SECRET
        generateValue: true
      - key: BETA_INVITE_CODE
        generateValue: true
      - key: TRUSTED_HOSTS
        value: portfolioiq-private-beta.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: portfolioiq-ephemeral-beta-db
          property: connectionString

databases:
  - name: portfolioiq-ephemeral-beta-db
    plan: free
    region: ohio
    postgresMajorVersion: "17"
    databaseName: portfolioiq
    user: portfolioiq
    # No direct database connections are allowed over the public internet.
    ipAllowList: []